      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
    Medicine:
      type: object
      description: |-
        Read-only projection of medicine/stock data owned by Inventory.

        This serializer has no Clinic ORM model and must never mutate Inventory
        master data.
      properties:
        medicine_id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        generic_name:
          type: string
          readOnly: true
        unit:
          type: string
          readOnly: true
        quantity_in_stock:
          type: integer
          readOnly: true
        reorder_level:
          type: integer
          readOnly: true
        is_low_stock:
          type: boolean
          readOnly: true
        status:
          type: string
          readOnly: true
      required:
      - generic_name
      - is_low_stock
      - medicine_id
      - name
      - quantity_in_stock
      - reorder_level
      - status
      - unit
    MedicineDispensation:
      type: object
      description: |-
        Serializer for Clinic-owned medicine dispensation records.

        Inventory owns medicine stock. inventory_transaction_id is populated by
        the dispensing orchestration/service after Inventory accepts the stock
        deduction.
      properties:
        dispensation_id:
          type: integer
          readOnly: true
        student_id:
          type: string
          description: Opaque student identifier owned by Registrar
          maxLength: 100
        medicine_id:
          type: string
          description: Opaque medicine identifier owned by Inventory
          maxLength: 100
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        reason:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/MedicineDispensationStatusEnum'
          readOnly: true
        inventory_transaction_id:
          type: string
          readOnly: true
          description: Inventory transaction created when stock is deducted
        rollback_transaction_id:
          type:
          - string
          - 'null'
          readOnly: true
          description: Inventory transaction created when a dispensation is rolled
            back
        dispensed_at:
          type: string
          format: date-time
          readOnly: true
        rolled_back_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - dispensation_id
      - dispensed_at
      - inventory_transaction_id
      - medicine_id
      - quantity
      - rollback_transaction_id
      - rolled_back_at
      - status
      - student_id
    MedicineDispensationReport:
      type: object
      properties:
        total_dispensations:
          type: integer
          readOnly: true
        total_quantity_dispensed:
          type: integer
          readOnly: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/MedicineDispensation'
          readOnly: true
      required:
      - results
      - total_dispensations
      - total_quantity_dispensed
    MedicineDispensationRequest:
      type: object
      description: |-
        Serializer for Clinic-owned medicine dispensation records.

        Inventory owns medicine stock. inventory_transaction_id is populated by
        the dispensing orchestration/service after Inventory accepts the stock
        deduction.
      properties:
        student_id:
          type: string
          minLength: 1
          description: Opaque student identifier owned by Registrar
          maxLength: 100
        medicine_id:
          type: string
          minLength: 1
          description: Opaque medicine identifier owned by Inventory
          maxLength: 100
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        reason:
          type: string
      required:
      - medicine_id
      - quantity
      - student_id
    MedicineDispensationStatusEnum:
      enum:
      - COMPLETED
      - ROLLED_BACK
      type: string
      description: |-
        * `COMPLETED` - Completed
        * `ROLLED_BACK` - Rolled Back
    MedicineInventoryReport:
      type: object
      properties:
        total_medicines:
          type: integer
          readOnly: true
        total_stock:
          type: integer
          readOnly: true
        low_stock_medicines:
          type: integer
          readOnly: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Medicine'
          readOnly: true
      required:
      - low_stock_medicines
      - results
      - total_medicines
      - total_stock
    MedicineWrite:
      type: object
      properties:
        medicine_id:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
        name:
          type: string
          maxLength: 150
        generic_name:
          type: string
          maxLength: 150
        unit:
          type: string
          maxLength: 40
        quantity_in_stock:
          type: integer
          maximum: 1000000
          minimum: 0
        reorder_level:
          type: integer
          maximum: 1000000
          minimum: 0
        status:
          $ref: '#/components/schemas/MedicineWriteStatusEnum'
        is_low_stock:
          type: boolean
