          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsultationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consultation'
          description: ''
        '409':
          description: Replay-key conflict or stale database record. Reload before
            retrying.
      summary: Create consultation
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Actor/path scoped replay key; required for external writes in
          durable_mock Inventory mode, optional otherwise. Reuse identical key/body
          after a network failure; changed body or expired replay returns 409. Uncertain
          Inventory outcomes return 503; do not retry with a new key.
        schema:
          type: string
          maxLength: 128
  /api/v1/consultations/{consultation_id}/:
