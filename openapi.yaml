  /api/v1/reports/medicine-dispensations/:
    get:
      tags:
        - Reports
      summary: Get medicine dispensations report
      description: >
        Returns a report derived from Clinic-owned medicine
        dispensation history. Results may be filtered by date range,
        student identifier, medicine identifier, and dispensation
        status.
      operationId: getMedicineDispensationsReport
      parameters:
        - $ref: "#/components/parameters/DateFromQuery"
        - $ref: "#/components/parameters/DateToQuery"
        - $ref: "#/components/parameters/StudentIdQuery"
        - $ref: "#/components/parameters/MedicineIdQuery"
        - $ref: "#/components/parameters/StatusQuery"
      responses:
        "200":
          description: Medicine dispensations report generated successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total_dispensations
                  - total_quantity_dispensed
                  - results
                properties:
                  total_dispensations:
                    type: integer
                    minimum: 0
                    example: 1
                  total_quantity_dispensed:
                    type: integer
                    minimum: 0
                    example: 2
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/MedicineDispensation"
              example:
                total_dispensations: 1
                total_quantity_dispensed: 2
                results:
                  - dispensation_id: 1
                    student_id: "2026-0001"
                    medicine_id: "MED-0001"
                    quantity: 2
                    reason: "Headache"
                    status: COMPLETED
                    inventory_transaction_id: "INV-TX-0001"
                    rollback_transaction_id: null
                    dispensed_at: "2026-09-29T14:15:00+08:00"
                    rolled_back_at: null
                    created_at: "2026-09-29T14:15:00+08:00"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "500":
          $ref: "#/components/responses/InternalServerError"


        "403":
          $ref: "#/components/responses/Forbidden"
  ####
  /api/v1/integrations/faculty/health-status/{student_id}/:
    get:
      tags:
        - Integrations
      summary: Get student health status for Faculty
      description: >
        Returns the latest permitted Clinic health status for a student
        to an authorized Faculty System consumer. This endpoint exposes
        only the limited health-status projection and does not expose
        health records, consultations, or medicine dispensation history.

        If the student exists in Registrar but has no Clinic health
        status record, the response uses NOT_AVAILABLE as an integration
        response state.
      operationId: getFacultyStudentHealthStatus
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
      responses:
        "200":
          description: Student health status projection retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationHealthStatus"
              examples:
                available:
                  summary: Student has a Clinic health status
                  value:
                    student_id: "2026-0001"
                    status: CLEARED
                    remarks: "Cleared for regular school activities"
                    effective_at: "2026-09-29T14:10:00+08:00"

                notAvailable:
                  summary: Student exists but has no Clinic health status
                  value:
                    student_id: "2026-0005"
                    status: NOT_AVAILABLE
                    remarks: null
                    effective_at: null

        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"
  ####
