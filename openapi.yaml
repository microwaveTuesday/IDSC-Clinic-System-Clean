      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestockResponse'
          description: ''
        '409':
          description: Replay-key conflict or stale database record. Reload before
            retrying.
        '503':
          description: Inventory reconciliation required; Owner must inspect the private
            incident queue before retrying.
