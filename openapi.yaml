        required: false
        description: Actor/path scoped replay key; required for external writes in
          durable_mock Inventory mode, optional otherwise. Reuse identical key/body
          after a network failure; changed body or expired replay returns 409. Uncertain
          Inventory outcomes return 503; do not retry with a new key.
        schema:
          type: string
