      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConsultationList'
          description: ''
      summary: List consultations
    post:
      operationId: v1_consultations_create
      description: Shared serialization and elevated clinical-deletion permission.
      tags:
