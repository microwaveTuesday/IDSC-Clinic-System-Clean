  /api/v1/medicine-dispensations/{dispensation_id}/rollback/:
    post:
      tags:
        - Medicine Dispensations
      summary: Roll back medicine dispensation
      description: >
        Reverses a completed medicine dispensation. Clinic requests
        Inventory to restore the previously deducted stock. Inventory
        returns a separate rollback transaction identifier, and Clinic
        marks the dispensation as ROLLED_BACK. A dispensation that has
        already been rolled back cannot be rolled back again.
      operationId: rollbackMedicineDispensation
      parameters:
        - $ref: "#/components/parameters/DispensationIdPath"
      responses:
        "200":
          description: Medicine dispensation rolled back successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicineDispensation"
              example:
                dispensation_id: 1
                student_id: "2026-0001"
                medicine_id: "MED-0001"
                quantity: 2
                reason: "Headache"
                status: ROLLED_BACK
                inventory_transaction_id: "INV-TX-0001"
                rollback_transaction_id: "INV-TX-0002"
                dispensed_at: "2026-09-29T14:15:00+08:00"
                rolled_back_at: "2026-09-29T14:20:00+08:00"
                created_at: "2026-09-29T14:15:00+08:00"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

        "409":
          $ref: "#/components/responses/Conflict"

        "422":
          $ref: "#/components/responses/UnprocessableEntity"

        "500":
          $ref: "#/components/responses/InternalServerError"

        "403":
          $ref: "#/components/responses/Forbidden"
