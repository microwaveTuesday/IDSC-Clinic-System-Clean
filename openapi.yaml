                additionalProperties: false
                required:
                  - count
                  - page
                  - page_size
                  - total_pages
                  - results
                properties:
                  count:
                    type: integer
                    minimum: 0
                    example: 1
                  page:
                    type: integer
                    minimum: 1
                    example: 1
                  page_size:
                    type: integer
                    minimum: 1
                    maximum: 100
                    example: 20
                  total_pages:
                    type: integer
                    minimum: 0
                    example: 1
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/HealthRecord"
              example:
                count: 1
                page: 1
                page_size: 20
                total_pages: 1
                results:
