          $ref: "#/components/responses/Unauthorized"

        "500":
          $ref: "#/components/responses/InternalServerError"


        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Health Records
      summary: Create health record
      description: >
        Creates a Clinic-owned health record for an active student.
        The supplied student_id is validated through the Registrar
        integration before the record is created.
      operationId: createHealthRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthRecordCreate"
            example:
              student_id: "2026-0001"
