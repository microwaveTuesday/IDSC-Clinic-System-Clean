      summary: Deactivate Clinic administrator
  /api/v1/consultations/:
    get:
      operationId: v1_consultations_list
      description: Shared serialization and elevated clinical-deletion permission.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
