openapi: 3.1.0

info:
  title: IDSC Clinic System API
  version: 1.0.0
  description: |
    Canonical API specification for the IDSC Clinic System.

    The Clinic System manages clinic-owned health records,
    consultations, health statuses, and medicine dispensations.

    Student identity and profile data are owned by the Registrar
    System and consumed by Clinic through an integration service.

    Medicine catalog, medicine stock, and stock transactions are
    owned by the Inventory System and consumed by Clinic through
    an integration service.

    For the midterm implementation, external Registrar and Inventory
    integrations may be represented by mock services while preserving
    the same ownership and API boundaries intended for final integration.

  contact:
    name: IDSC Clinic System Team

servers:
  - url: http://127.0.0.1:8000
    description: Local Django development server

tags:
  - name: System
    description: API health and service-status operations.

  - name: Dashboard
    description: Aggregated Clinic dashboard information.

  - name: Students
    description: >
      Read-only student projections obtained from the Registrar
      integration. The Clinic System does not own student identity
      or profile data.

  - name: Health Records
    description: >
      Management of persistent student health information owned
      by the Clinic System.

  - name: Consultations
    description: >
      Management of Clinic visits and consultation records.

  - name: Health Statuses
    description: >
      Management of Clinic-issued student health statuses.

  - name: Medicines
    description: >
      Read-only medicine and stock projections obtained from the
      Inventory integration. The Clinic System does not own the
      medicine catalog or stock.

  - name: Medicine Dispensations
    description: >
      Clinic-owned medicine dispensing history and rollback
      operations.

  - name: Reports
    description: >
      Clinic reporting operations for visits, health records,
      medicine inventory, and medicine dispensations.

  - name: Integrations
    description: >
      Restricted read-only Clinic integration operations exposed
      to other College Management System modules.


components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: >
        Django session cookie used to authenticate Clinic API requests.
        The cookie is issued after successful login through the Clinic
        authentication endpoints.

  parameters:

    StudentIdPath:
      name: student_id
      in: path
      required: true
      description: >
        Opaque student identifier owned by the Registrar System.
      schema:
        type: string
      example: "2026-0001"

    MedicineIdPath:
      name: medicine_id
      in: path
      required: true
      description: >
        Opaque medicine identifier owned by the Inventory System.
      schema:
        type: string
      example: "MED-0001"

    HealthRecordIdPath:
      name: health_record_id
      in: path
      required: true
      description: Clinic-owned health record identifier.
      schema:
        type: integer
        minimum: 1
      example: 1

    ConsultationIdPath:
      name: consultation_id
      in: path
      required: true
      description: Clinic-owned consultation identifier.
      schema:
        type: integer
        minimum: 1
      example: 1

    StatusIdPath:
      name: status_id
      in: path
      required: true
      description: Clinic-owned health status identifier.
      schema:
        type: integer
        minimum: 1
      example: 1

    DispensationIdPath:
      name: dispensation_id
      in: path
      required: true
      description: Clinic-owned medicine dispensation identifier.
      schema:
        type: integer
        minimum: 1
      example: 1

    StudentIdQuery:
      name: student_id
      in: query
      required: false
      description: Filter results by Registrar-owned student identifier.
      schema:
        type: string
      example: "2026-0001"

    MedicineIdQuery:
      name: medicine_id
      in: query
      required: false
      description: Filter results by Inventory-owned medicine identifier.
      schema:
        type: string
      example: "MED-0001"

    SearchQuery:
      name: search
      in: query
      required: false
      description: Free-text search value for fields supported by the operation.
      schema:
        type: string
        minLength: 1
      example: headache

    StatusQuery:
      name: status
      in: query
      required: false
      description: Filter by the status supported by the requested resource.
      schema:
        type: string

    BloodTypeQuery:
      name: blood_type
      in: query
      required: false
      description: Filter health records by blood type.
      schema:
        type: string
      example: "O+"

    LowStockQuery:
      name: low_stock
      in: query
      required: false
      description: >
        When true, return medicines whose quantity in stock is less
        than or equal to their reorder level.
      schema:
        type: boolean
      example: true

    CourseQuery:
      name: course
      in: query
      required: false
      description: Filter Registrar student projections by course.
      schema:
        type: string
      example: BSIT

    SectionQuery:
      name: section
      in: query
      required: false
      description: Filter Registrar student projections by section.
      schema:
        type: string
      example: 3A

    DateFromQuery:
      name: date_from
      in: query
      required: false
      description: >
        Inclusive beginning of a date range in YYYY-MM-DD format.
      schema:
        type: string
        format: date
      example: "2026-09-01"

    DateToQuery:
      name: date_to
      in: query
      required: false
      description: >
        Inclusive end of a date range in YYYY-MM-DD format.
      schema:
        type: string
        format: date
      example: "2026-09-30"

    OrderingQuery:
      name: ordering
      in: query
      required: false
      description: >
        Sort field. Prefix the field with "-" for descending order.
        Each operation restricts ordering to its documented fields.
      schema:
        type: string
      example: "-created_at"

    PageQuery:
      name: page
      in: query
      required: false
      description: Page number. Defaults to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    PageSizeQuery:
      name: page_size
      in: query
      required: false
      description: >
        Number of results per page. Defaults to 20 and cannot exceed 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20


    UserIdPath:
      name: user_id
      in: path
      required: true
      description: Clinic staff account identifier.
      schema:
        type: integer
        minimum: 0
      example: 12
  schemas:
    HealthRecordCreate:
      type: object
      additionalProperties: false
      required:
        - student_id
      properties:
        student_id:
          type: string
          maxLength: 100
          description: Registrar-owned student identifier.
          example: "2026-0001"
        blood_type:
          type: string
          enum:
            - "A+"
            - "A-"
            - "B+"
            - "B-"
            - "AB+"
            - "AB-"
            - "O+"
            - "O-"
            - Unknown
          example: "O+"
        allergies:
          type: string
          default: ""
          example: "Penicillin"
        medical_history:
          type: string
          default: ""
          example: "History of asthma"
        current_medications:
          type: string
          default: ""
          example: "None"
        height_cm:
          type:
            - number
            - "null"
          minimum: 0.01
          maximum: 300
          multipleOf: 0.01
          example: 170.5
        weight_kg:
          type:
            - number
            - "null"
          minimum: 0.01
          maximum: 500
          multipleOf: 0.01
          example: 65.2

    HealthRecordUpdate:
      type: object
      additionalProperties: false
      required:
        - student_id
      properties:
        student_id:
          type: string
          maxLength: 100
          example: "2026-0001"
        blood_type:
          type: string
          enum:
            - "A+"
            - "A-"
            - "B+"
            - "B-"
            - "AB+"
            - "AB-"
            - "O+"
            - "O-"
            - Unknown
          example: "O+"
        allergies:
          type: string
          example: "Penicillin"
        medical_history:
          type: string
          example: "History of asthma"
        current_medications:
          type: string
          example: "None"
        height_cm:
          type:
            - number
            - "null"
          minimum: 0.01
          maximum: 300
          multipleOf: 0.01
          example: 170.5
        weight_kg:
          type:
            - number
            - "null"
          minimum: 0.01
          maximum: 500
          multipleOf: 0.01
          example: 65.2

    HealthRecordPatch:
      type: object
      additionalProperties: false
      properties:
        student_id:
          type: string
          maxLength: 100
          example: "2026-0001"
        blood_type:
          type: string
          enum:
            - "A+"
            - "A-"
            - "B+"
            - "B-"
            - "AB+"
            - "AB-"
            - "O+"
            - "O-"
            - Unknown
          example: "O+"
        allergies:
          type: string
          example: "Penicillin"
        medical_history:
          type: string
          example: "History of asthma"
        current_medications:
          type: string
          example: "None"
        height_cm:
          type:
            - number
            - "null"
          minimum: 0.01
          maximum: 300
          multipleOf: 0.01
          example: 170.5
        weight_kg:
          type:
            - number
            - "null"
          minimum: 0.01
          maximum: 500
          multipleOf: 0.01
          example: 65.2

    HealthRecord:
      type: object
      additionalProperties: false
      required:
        - health_record_id
        - student_id
        - allergies
        - medical_history
        - current_medications
        - created_at
        - updated_at
      properties:
        health_record_id:
          type: integer
          minimum: 1
          readOnly: true
          example: 1
        student_id:
          type: string
          example: "2026-0001"
        blood_type:
          type:
            - string
            - "null"
          example: "O+"
        allergies:
          type: string
          example: "Penicillin"
        medical_history:
          type: string
          example: "History of asthma"
        current_medications:
          type: string
          example: "None"
        height_cm:
          type:
            - number
            - "null"
          exclusiveMinimum: 0
          example: 170.5
        weight_kg:
          type:
            - number
            - "null"
          exclusiveMinimum: 0
          example: 65.2
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-09-29T14:00:00+08:00"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-09-29T14:00:00+08:00"


    ConsultationCreate:
      type: object
      additionalProperties: false
      required:
        - student_id
        - chief_complaint
      properties:
        student_id:
          type: string
          maxLength: 100
          example: "2026-0001"
        chief_complaint:
          type: string
          minLength: 1
          example: "Headache and dizziness"
        assessment:
          type: string
          default: ""
          example: "Possible tension headache"
        treatment:
          type: string
          default: ""
          example: "Rest and hydration advised"
        notes:
          type: string
          default: ""
          example: "Return if symptoms persist"

    ConsultationUpdate:
      type: object
      additionalProperties: false
      required:
        - student_id
        - chief_complaint
      properties:
        student_id:
          type: string
          maxLength: 100
          example: "2026-0001"
        chief_complaint:
          type: string
          minLength: 1
          example: "Headache and dizziness"
        assessment:
          type: string
          example: "Possible tension headache"
        treatment:
          type: string
          example: "Rest and hydration advised"
        notes:
          type: string
          example: "Return if symptoms persist"

    ConsultationPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        student_id:
          type: string
          maxLength: 100
          example: "2026-0001"
        chief_complaint:
          type: string
          minLength: 1
          example: "Headache and dizziness"
        assessment:
          type: string
          example: "Possible tension headache"
        treatment:
          type: string
          example: "Rest and hydration advised"
        notes:
          type: string
          example: "Return if symptoms persist"

    Consultation:
      type: object
      additionalProperties: false
      required:
        - consultation_id
        - student_id
        - chief_complaint
        - assessment
        - treatment
        - notes
        - consulted_at
        - created_at
        - updated_at
      properties:
        consultation_id:
          type: integer
          minimum: 1
          readOnly: true
          example: 1
        student_id:
          type: string
          example: "2026-0001"
        chief_complaint:
          type: string
          example: "Headache and dizziness"
        assessment:
          type: string
          example: "Possible tension headache"
        treatment:
          type: string
          example: "Rest and hydration advised"
        notes:
          type: string
          example: "Return if symptoms persist"
        consulted_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-09-29T14:05:00+08:00"
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-09-29T14:05:00+08:00"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-09-29T14:05:00+08:00"


    HealthStatusValue:
      type: string
      enum:
        - CLEARED
        - RESTRICTED
        - UNDER_OBSERVATION
      example: CLEARED

    HealthStatusCreate:
      type: object
      additionalProperties: false
      required:
        - student_id
        - status
      properties:
        student_id:
          type: string
          maxLength: 100
          example: "2026-0001"
        status:
          $ref: "#/components/schemas/HealthStatusValue"
        remarks:
          type: string
          default: ""
          example: "Cleared for regular school activities"

    HealthStatusUpdate:
      type: object
      additionalProperties: false
      required:
        - student_id
        - status
      properties:
        student_id:
          type: string
          maxLength: 100
          example: "2026-0001"
        status:
          $ref: "#/components/schemas/HealthStatusValue"
        remarks:
          type: string
          example: "Cleared for regular school activities"

    HealthStatusPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        student_id:
          type: string
          maxLength: 100
          example: "2026-0001"
        status:
          $ref: "#/components/schemas/HealthStatusValue"
        remarks:
          type: string
          example: "Cleared for regular school activities"

    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status_id
        - student_id
        - status
        - remarks
        - effective_at
        - created_at
        - updated_at
      properties:
        status_id:
          type: integer
          minimum: 1
          readOnly: true
          example: 1
        student_id:
          type: string
          example: "2026-0001"
        status:
          $ref: "#/components/schemas/HealthStatusValue"
        remarks:
          type: string
          example: "Cleared for regular school activities"
        effective_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-09-29T14:10:00+08:00"
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-09-29T14:10:00+08:00"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-09-29T14:10:00+08:00"


    MedicineDispensationStatus:
      type: string
      enum:
        - COMPLETED
        - ROLLED_BACK
      example: COMPLETED

    MedicineDispensationCreate:
      type: object
      additionalProperties: false
      required:
        - student_id
        - medicine_id
        - quantity
      properties:
        student_id:
          type: string
          maxLength: 100
          example: "2026-0001"
        medicine_id:
          type: string
          maxLength: 100
          example: "MED-0001"
        quantity:
          type: integer
          minimum: 1
          example: 2
        reason:
          type: string
          default: ""
          example: "Headache"

    MedicineDispensation:
      type: object
      additionalProperties: false
      required:
        - dispensation_id
        - student_id
        - medicine_id
        - quantity
        - reason
        - status
        - inventory_transaction_id
        - dispensed_at
        - created_at
      properties:
        dispensation_id:
          type: integer
          minimum: 1
          readOnly: true
          example: 1
        student_id:
          type: string
          example: "2026-0001"
        medicine_id:
          type: string
          example: "MED-0001"
        quantity:
          type: integer
          minimum: 1
          example: 2
        reason:
          type: string
          example: "Headache"
        status:
          allOf:
            - $ref: "#/components/schemas/MedicineDispensationStatus"
          readOnly: true
        inventory_transaction_id:
          type: string
          readOnly: true
          example: "INV-TX-0001"
        rollback_transaction_id:
          type:
            - string
            - "null"
          readOnly: true
          example: null
        dispensed_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-09-29T14:15:00+08:00"
        rolled_back_at:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
          example: null
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-09-29T14:15:00+08:00"


    StudentStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - GRADUATED
      example: ACTIVE

    Student:
      type: object
      additionalProperties: false
      description: >
        Read-only student projection obtained from the Registrar
        integration. The Clinic System does not own this data.
      required:
        - student_id
        - first_name
        - last_name
        - course
        - section
        - status
      properties:
        student_id:
          type: string
          readOnly: true
          example: "2026-0001"
        first_name:
          type: string
          readOnly: true
          example: Juan
        last_name:
          type: string
          readOnly: true
          example: Dela Cruz
        course:
          type: string
          readOnly: true
          example: BSIT
        section:
          type: string
          readOnly: true
          example: 3A
        status:
          allOf:
            - $ref: "#/components/schemas/StudentStatus"
          readOnly: true


    MedicineStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
      example: ACTIVE

    Medicine:
      type: object
      additionalProperties: false
      description: >
        Read-only medicine and stock projection obtained from the
        Inventory integration. The Clinic System does not own the
        medicine catalog or stock quantity.
      required:
        - medicine_id
        - name
        - generic_name
        - unit
        - quantity_in_stock
        - reorder_level
        - is_low_stock
        - status
      properties:
        medicine_id:
          type: string
          readOnly: true
          example: "MED-0001"
        name:
          type: string
          readOnly: true
          example: Paracetamol
        generic_name:
          type: string
          readOnly: true
          example: Paracetamol
        unit:
          type: string
          readOnly: true
          example: tablet
        quantity_in_stock:
          type: integer
          minimum: 0
          readOnly: true
          example: 100
        reorder_level:
          type: integer
          minimum: 0
          readOnly: true
          example: 20
        is_low_stock:
          type: boolean
          readOnly: true
          description: >
            True when quantity_in_stock is less than or equal to
            reorder_level.
          example: false
        status:
          allOf:
            - $ref: "#/components/schemas/MedicineStatus"
          readOnly: true


    DashboardSummary:
      type: object
      additionalProperties: false
      required:
        - total_students
        - total_health_records
        - total_medicine_stock
        - low_stock_medicines
      properties:
        total_students:
          type: integer
          minimum: 0
          description: Count obtained from the Registrar integration.
          example: 1200
        total_health_records:
          type: integer
          minimum: 0
          description: Count of Clinic-owned health records.
          example: 850
        total_medicine_stock:
          type: integer
          minimum: 0
          description: >
            Aggregate medicine stock quantity obtained from the
            Inventory integration.
          example: 540
        low_stock_medicines:
          type: integer
          minimum: 0
          description: >
            Count of low-stock medicines obtained from the Inventory
            integration.
          example: 3

    ActivityType:
      type: string
      enum:
        - HEALTH_RECORD
        - CONSULTATION
        - HEALTH_STATUS
        - MEDICINE_DISPENSATION
        - MEDICINE_DISPENSATION_ROLLBACK
      example: CONSULTATION

    RecentActivity:
      type: object
      additionalProperties: false
      required:
        - activity_type
        - reference_id
        - student_id
        - occurred_at
      properties:
        activity_type:
          $ref: "#/components/schemas/ActivityType"
        reference_id:
          type: integer
          minimum: 1
          description: >
            Identifier of the corresponding Clinic-owned resource.
          example: 18
        student_id:
          type: string
          example: "2026-0001"
        occurred_at:
          type: string
          format: date-time
          example: "2026-09-29T13:50:00+08:00"

    Dashboard:
      type: object
      additionalProperties: false
      required:
        - summary
        - recent_activity
      properties:
        summary:
          $ref: "#/components/schemas/DashboardSummary"
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/RecentActivity"


    IntegrationHealthStatusValue:
      type: string
      enum:
        - CLEARED
        - RESTRICTED
        - UNDER_OBSERVATION
        - NOT_AVAILABLE
      example: CLEARED

    IntegrationHealthStatus:
      type: object
      additionalProperties: false
      description: >
        Limited read-only health-status representation exposed to
        authorized external College Management System modules.
      required:
        - student_id
        - status
        - remarks
        - effective_at
      properties:
        student_id:
          type: string
          readOnly: true
          example: "2026-0001"
        status:
          allOf:
            - $ref: "#/components/schemas/IntegrationHealthStatusValue"
          readOnly: true
        remarks:
          type:
            - string
            - "null"
          readOnly: true
          example: "Cleared for regular school activities"
        effective_at:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
          example: "2026-09-29T14:10:00+08:00"


    FieldErrors:
      type: object
      description: >
        Optional field-level validation errors. Each property name
        identifies the invalid request field and contains one or
        more human-readable error messages.
      additionalProperties:
        type: array
        items:
          type: string
      example:
        quantity:
          - "Quantity must be greater than zero."

    ProblemDetails:
      type: object
      additionalProperties: false
      description: >
        Standard error representation used by the Clinic API.
        The code field is a stable machine-readable error code.
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
      properties:
        type:
          type: string
          format: uri-reference
          example: "about:blank"
        title:
          type: string
          example: "Validation Error"
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 400
        detail:
          type: string
          example: "One or more fields are invalid."
        instance:
          type: string
          format: uri-reference
          example: "/api/v1/medicine-dispensations/"
        code:
          type: string
          description: >
            Stable machine-readable error code. Clients should use
            this value rather than parsing the detail message.
          example: "VALIDATION_ERROR"
        errors:
          $ref: "#/components/schemas/FieldErrors"

    ClinicUser:
      type: object
      additionalProperties: false
      required:
      - user_id
      - username
      - first_name
      - last_name
      - email
      - role
      - is_active
      properties:
        user_id:
          type: integer
          readOnly: true
          example: 12
        username:
          type: string
          example: clinic.staff
        first_name:
          type: string
          example: Maria
        last_name:
          type: string
          example: Santos
        email:
          type: string
          format: email
          example: maria.santos@example.edu
        role:
          type:
          - string
          - 'null'
          enum:
            - ADMIN
            - STAFF
            - null
          readOnly: true
          example: STAFF
        is_active:
          type: boolean
          readOnly: true
          example: true
    StaffCreate:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          maxLength: 150
          example: clinic.staff
        first_name:
          type: string
          maxLength: 150
          example: Maria
        last_name:
          type: string
          maxLength: 150
          example: Santos
        email:
          type: string
          maxLength: 254
          format: email
          example: maria.santos@example.edu
        password:
          type: string
          format: password
          writeOnly: true
          example: TemporaryPassword123!
    StaffUpdate:
      type: object
      additionalProperties: false
      properties:
        first_name:
          type: string
          maxLength: 150
          example: Maria
        last_name:
          type: string
          maxLength: 150
          example: Santos
        email:
          type: string
          maxLength: 254
          format: email
          example: maria.santos@example.edu
  responses:

    BadRequest:
      description: >
        The request contains invalid syntax, fields, query parameters,
        pagination values, ordering, or date-range values.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "about:blank"
            title: "Validation Error"
            status: 400
            detail: "One or more fields are invalid."
            instance: "/api/v1/medicine-dispensations/"
            code: "VALIDATION_ERROR"
            errors:
              quantity:
                - "Quantity must be greater than zero."

    Unauthorized:
      description: Authentication is required or the supplied authentication is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://clinic.example/problems/unauthorized"
            title: "Unauthorized"
            status: 401
            detail: "Authentication credentials were not provided."
            instance: "/api/v1/health-records/"
            code: "not_authenticated"

    Forbidden:
      description: >
        The caller is authenticated but does not have permission
        to perform the requested operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://clinic.example/problems/forbidden"
            title: "Forbidden"
            status: 403
            detail: "Clinic staff access is required."
            instance: "/api/v1/health-records/"
            code: "permission_denied"

    NotFound:
      description: >
        The requested Clinic resource or referenced external resource
        does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            clinicResourceNotFound:
              summary: Clinic resource not found
              value:
                type: "about:blank"
                title: "Health Record Not Found"
                status: 404
                detail: "The requested health record does not exist."
                instance: "/api/v1/health-records/999/"
                code: "HEALTH_RECORD_NOT_FOUND"

            studentNotFound:
              summary: Registrar student not found
              value:
                type: "about:blank"
                title: "Student Not Found"
                status: 404
                detail: "The supplied student_id was not found in Registrar."
                instance: "/api/v1/health-records/"
                code: "STUDENT_NOT_FOUND"

            medicineNotFound:
              summary: Inventory medicine not found
              value:
                type: "about:blank"
                title: "Medicine Not Found"
                status: 404
                detail: "The supplied medicine_id was not found in Inventory."
                instance: "/api/v1/medicine-dispensations/"
                code: "MEDICINE_NOT_FOUND"

    Conflict:
      description: >
        The requested operation conflicts with the current state
        of the resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "about:blank"
            title: "Dispensation Already Rolled Back"
            status: 409
            detail: "This medicine dispensation has already been rolled back."
            instance: "/api/v1/medicine-dispensations/1/rollback/"
            code: "DISPENSATION_ALREADY_ROLLED_BACK"

    UnprocessableEntity:
      description: >
        The request is syntactically valid but cannot be completed
        because a Clinic business rule or external resource state
        prevents the operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            insufficientStock:
              summary: Insufficient medicine stock
              value:
                type: "about:blank"
                title: "Insufficient Medicine Stock"
                status: 422
                detail: "The requested quantity exceeds available medicine stock."
                instance: "/api/v1/medicine-dispensations/"
                code: "INSUFFICIENT_STOCK"
                errors:
                  quantity:
                    - "Requested quantity exceeds available stock."

            inactiveStudent:
              summary: Student is not active
              value:
                type: "about:blank"
                title: "Student Not Active"
                status: 422
                detail: "The student exists but is not active for this operation."
                instance: "/api/v1/medicine-dispensations/"
                code: "STUDENT_NOT_ACTIVE"

            inactiveMedicine:
              summary: Medicine is inactive
              value:
                type: "about:blank"
                title: "Medicine Unavailable"
                status: 422
                detail: "The selected medicine is not active for dispensing."
                instance: "/api/v1/medicine-dispensations/"
                code: "MEDICINE_INACTIVE"

    InternalServerError:
      description: An unexpected Clinic server error occurred.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "about:blank"
            title: "Internal Server Error"
            status: 500
            detail: "An unexpected error occurred while processing the request."
            instance: "/api/v1/health-records/"
            code: "INTERNAL_SERVER_ERROR"
security:
  - sessionAuth: []

paths:
  /api/auth/csrf/:
    get:
      tags:
        - Authentication
      summary: Get CSRF token
      description: >
        Returns a CSRF token and ensures the Django CSRF cookie is set.
        The token must be supplied for CSRF-protected authentication
        operations such as login and logout.
      operationId: getCsrfToken
      security: []
      responses:
        "200":
          description: CSRF token issued successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - csrfToken
                properties:
                  csrfToken:
                    type: string
              example:
                csrfToken: "example-csrf-token"

  /api/auth/login/:
    post:
      tags:
        - Authentication
      summary: Log in to the Clinic system
      description: >
        Authenticates a Clinic user and creates a Django session.
        A valid CSRF token is required.
      operationId: loginClinicUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
            example:
              username: "clinic_staff"
              password: "example-password"
      responses:
        "200":
          description: Login successful and session created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - user
                properties:
                  message:
                    type: string
                  user:
                    type: object
                    required:
                      - id
                      - username
                      - email
                      - is_staff
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      email:
                        type: string
                        format: email
                      is_staff:
                        type: boolean
              example:
                message: "Login successful."
                user:
                  id: 1
                  username: "clinic_staff"
                  email: "clinic@example.com"
                  is_staff: false
        "400":
          description: Username or password was not supplied.
          content:
            application/json:
              schema:
                type: object
                required:
                  - detail
                properties:
                  detail:
                    type: string
              example:
                detail: "Username and password are required."
        "401":
          description: Invalid username or password.
          content:
            application/json:
              schema:
                type: object
                required:
                  - detail
                properties:
                  detail:
                    type: string
              example:
                detail: "Invalid username or password."
        "403":
          description: CSRF validation failed. Django may return an HTML CSRF failure response before the login view is executed.
          content:
            text/html:
              schema:
                type: string
              example: <!DOCTYPE html>...
  /api/auth/logout/:
    post:
      tags:
        - Authentication
      summary: Log out of the Clinic system
      description: >
        Logs out the authenticated user and destroys the current
        Django session. A valid CSRF token is required.
      operationId: logoutClinicUser
      responses:
        "200":
          description: Logout successful.
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
              example:
                message: "Logout successful."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/me/:
    get:
      tags:
        - Authentication
      summary: Get current Clinic user
      description: Returns the currently authenticated user's account information.
      operationId: getCurrentClinicUser
      responses:
        "200":
          description: Current authenticated user.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - username
                  - email
                  - is_staff
                properties:
                  id:
                    type: integer
                  username:
                    type: string
                  email:
                    type: string
                    format: email
                  is_staff:
                    type: boolean
              example:
                id: 1
                username: "clinic_staff"
                email: "clinic@example.com"
                is_staff: false
        "401":
          $ref: "#/components/responses/Unauthorized"
  ####
  /api/v1/health/:
    get:
      tags:
        - System
      summary: Check Clinic API health
      description: >
        Returns the current availability of the Clinic API.
        This endpoint can be used by developers and other systems
        to verify that the Clinic service is running.
      operationId: getApiHealth
      responses:
        "200":
          description: Clinic API is available.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - OK
                    example: OK
              example:
                status: OK

        "500":
          $ref: "#/components/responses/InternalServerError"

      security: []

