openapi: 3.1.0
info:
  title: IDSC Clinic System API
  version: 1.0.0
  description: OpenAPI documentation for the IDSC Clinic System backend. Provides
    endpoints for managing student records, health records, clinical consultations,
    vital signs, medical histories, and allergies.
paths:
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Return a CSRF token and ensure the CSRF cookie is set.
      tags:
      - auth
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
          description: ''
      summary: Get CSRF token
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate a user and create a Django session.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
      summary: Log in to the Clinic system
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Log out the current authenticated user and destroy the session.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
      summary: Log out of the Clinic system
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Return information about the currently authenticated user.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
          description: ''
      summary: Get current Clinic user
  /api/auth/owner/register/:
    post:
      operationId: auth_owner_register_create
      description: One-time first Owner registration. Requires CSRF even without a
        session. Creates exactly one Owner, starts a Django session, and permanently
        closes registration.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OwnerRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OwnerRegisterRequest'
        required: true
      security: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '409':
          description: Owner registration is already complete.
      summary: Register the first and only Owner
  /api/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: Change the authenticated user's password after verifying the current
        password. Requires a session cookie and X-CSRFToken. Django password validators
        apply. The current session is rotated and retained; other sessions expire
        on their next request.
      summary: Change your password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/auth/setup/:
    get:
      operationId: auth_setup_retrieve
      description: Public first-run status only. Inactive or previously registered
        Owners keep registration closed.
      tags:
      - auth
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerSetupStatus'
          description: ''
      summary: Check first Owner registration availability
  /api/auth/username/change/:
    post:
      operationId: auth_username_change_create
      description: Change only the signed-in user's username after current-password
        verification. Requires session authentication and CSRF. The current session
        is retained; future logins use the new username.
      summary: Change your username
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernameChangeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UsernameChangeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UsernameChangeRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
          description: ''
  /api/v1/admins/:
    get:
      operationId: v1_admins_list
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminAccount'
          description: ''
      summary: List Clinic administrators
    post:
      operationId: v1_admins_create
      description: Owner only. Maximum five regular administrators, including inactive
        accounts; owners do not count. At capacity returns 409. Requires owner current
        password, CSRF and a validated new password.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicUser'
          description: ''
        '409':
          description: Maximum 5 administrators, including inactive accounts. Delete
            an administrator to free a slot.
      summary: Create Clinic administrator
  /api/v1/admins/{user_id}/:
    get:
      operationId: v1_admins_retrieve
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccount'
          description: ''
      summary: Retrieve administrator account (owner only)
    put:
      operationId: v1_admins_update
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedAccountUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ManagedAccountUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManagedAccountUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicUser'
          description: ''
      summary: Update administrator account (owner only)
    patch:
      operationId: v1_admins_partial_update
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedManagedAccountUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedManagedAccountUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedManagedAccountUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicUser'
          description: ''
      summary: Partially update administrator account (owner only)
    delete:
      operationId: v1_admins_destroy
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
      summary: Delete Clinic administrator
  /api/v1/admins/{user_id}/activate/:
    post:
      operationId: v1_admins_activate_create
      parameters:
      - in: path
        name: user_id
