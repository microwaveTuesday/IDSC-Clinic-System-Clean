name: idsc-clinic-staging
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: clinic
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set private DB_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U clinic -d clinic']
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      DEBUG: 'False'
      SECRET_KEY: ${SECRET_KEY:?Set private SECRET_KEY of at least 50 characters}
      ALLOWED_HOSTS: ${CLINIC_HOST:-localhost}
      CORS_ALLOWED_ORIGINS: https://${CLINIC_HOST:-localhost}
      CSRF_TRUSTED_ORIGINS: https://${CLINIC_HOST:-localhost}
      TRUST_PROXY_HTTPS: '1'
      CLINIC_DATA_BACKEND: database
      INVENTORY_BACKEND: durable_mock
      MOCK_INVENTORY_DB: /data/mock-inventory.sqlite3
      MOCK_WORKSPACES_ENABLED: 'True'
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: clinic
      DB_USER: clinic
      DB_PASSWORD: ${DB_PASSWORD:?Set private DB_PASSWORD}
      DB_HOST: postgres
      STATIC_ROOT: /static
    volumes: [inventory-data:/data, static-data:/static]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/auth/setup/', headers={'Host':'${CLINIC_HOST:-localhost}', 'X-Forwarded-Proto':'https'}); assert urllib.request.urlopen(r, timeout=3).status == 200"]
      interval: 15s
      timeout: 5s
      retries: 12
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      CLINIC_HOST: ${CLINIC_HOST:-localhost}
    ports: ['127.0.0.1:443:443']
    volumes: [caddy-data:/data, static-data:/static:ro]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres-data:
  inventory-data:
  static-data:
  caddy-data:
